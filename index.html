<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo 3D editable</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .scene {
      width: 300px;
      height: 300px;
      perspective: 800px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-25deg) rotateY(-35deg);
      cursor: grab;
    }

    .face {
      position: absolute;
      width: 300px;
      height: 300px;
      background: white;
      border: 4px solid black;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .label {
      font-size: 120px;
      font-weight: bold;
      line-height: 1;
      display: inline-block;
    }

    .front  { transform: translateZ(150px); }
    .back   { transform: rotateY(180deg) translateZ(150px); }
    .right  { transform: rotateY(90deg) translateZ(150px); }
    .left   { transform: rotateY(-90deg) translateZ(150px); }
    .top    { transform: rotateX(90deg) translateZ(150px); }
    .bottom { transform: rotateX(-90deg) translateZ(150px); }

  .logo {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 120px;
  height: auto;
  z-index: 999;
}
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Logo MasterPol">
  <div class="scene">
    <div class="cube" id="cube">
      <div class="face front"><span class="label" id="label-front"></span></div>
      <div class="face back"><span class="label" id="label-back"></span></div>
      <div class="face right"><span class="label" id="label-right"></span></div>
      <div class="face left"><span class="label" id="label-left"></span></div>
      <div class="face top"><span class="label" id="label-top"></span></div>
      <div class="face bottom"><span class="label" id="label-bottom"></span></div>
    </div>
  </div>

  <script>
    // =========================
    // CONFIGURACIÓN EDITABLE
    // =========================
    const CONFIG = {
      front:  { number: "2", rotation: 0,   x: 0,  y: 0 },
      back:   { number: "4", rotation: 0,   x: 0,  y: 0 },
      right:  { number: "3", rotation: 270,  x: 0,  y: 0 },
      left:   { number: "1", rotation: 270,   x: 0,  y: 0 },
      top:    { number: "5", rotation: 90, x: 0,  y: 0 },
      bottom: { number: "6", rotation: 90
      , x: 0,  y: 0 }
    };

    // Aplica la configuración a las caras
    function applyConfig() {
      for (const face in CONFIG) {
        const label = document.getElementById("label-" + face);
        const cfg = CONFIG[face];

        label.textContent = cfg.number;
        label.style.transform =
          `translate(${cfg.x}px, ${cfg.y}px) rotate(${cfg.rotation}deg)`;
      }
    }

    applyConfig();

    // Giro con ratón
    const cube = document.getElementById("cube");
    let isDragging = false;
    let lastX = 0;
    let lastY = 0;
    let rotX = -25;
    let rotY = -35;

    function updateCube() {
      cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    cube.addEventListener("mousedown", (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      rotY += dx * 0.6;
      rotX -= dy * 0.6;
      lastX = e.clientX;
      lastY = e.clientY;
      updateCube();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });
  </script>

</body>
</html>
